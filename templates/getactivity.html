{% from "components/activity_card.html" import activity_card %} {% from
"components/icons.html" import house_icon %}
<html>
  <head>
    <title>plottwist</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#480052" />
    <link rel="manifest" href="{{ url_for('static', path='manifest.webmanifest') }}" />
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', path='icons/favicon-32.png') }}" />
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', path='icons/favicon-16.png') }}" />
    <link rel="apple-touch-icon" href="{{ url_for('static', path='icons/apple-touch-icon.png') }}" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="plottwist" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-casablanca: #f6c146;
        --color-darkamethyst: #480052;
        --color-carnation: #f45f57;
        --color-seagreen: #4c956c;
        --color-lavender: #a09ebb;
        --font-lazydog: "Lazy Dog", sans-serif;
      }
    </style>
    <link
      rel="stylesheet"
      href="{{ url_for('static', path='css/style.css') }}"
    />
  </head>
  <body
    class="min-h-screen flex items-center justify-center bg-darkamethyst p-4"
  >
    <div class="activity-modal">
      <a
        class="activity-modal-close flex items-center justify-center"
        href="/"
        aria-label="Back to home"
      >
        {{ house_icon(class_="!w-4 !h-4") }}
      </a>
      {{ activity_card(activities[0]) }}
    </div>
    <script src="{{ url_for('static', path='js/register-sw.js') }}"></script>
  </body>
</html>
